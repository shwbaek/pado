[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "pado-optics"
version = "1.1.0"
description = "Pytorch Automatic Differentiable Optics"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Seung-Hwan Baek", email = "shwbaek@postech.ac.kr" },
    { name = "Dong-Ha Shin", email = "0218sdh@gmail.com"  },
    { name = "Yujin Jeon" },
    { name = "Seung-Woo Yoon" },
    { name = "Eunsue Choi" },
    { name = "Gawoon Ban" },
    { name = "Hyunmo Kang" }
]
requires-python = ">=3.10"
dependencies = ["torch>=2.10"]

[project.optional-dependencies]
array = ["numpy>=1.24"]
viz = ["matplotlib>=3.7"]
mat = ["scipy>=1.10"]

[project.urls]
Homepage = "https://github.com/shwbaek/pado"
Repository = "https://github.com/shwbaek/pado.git"
Documentation = "https://shwbaek.github.io/pado"

[tool.setuptools]
packages = ["pado"]
include-package-data = false
